services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-data_service}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-data_service}
      POSTGRES_DB: ${POSTGRES_DB:-data_service}
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-data_service}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  data-service:
    build: ./data-service
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-data_service}:${POSTGRES_PASSWORD:-data_service}@postgres:5432/${POSTGRES_DB:-data_service}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:-IFY4MerKggSfdziHDy5GLBuAr9aSIYsYxhZTKdLWDeo=}
      DEFAULT_LOCK_TTL_SECONDS: ${DEFAULT_LOCK_TTL_SECONDS:-900}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"
    networks:
      - backend

  parser-service:
    build: ./parser-service
    environment:
      DATA_SERVICE_URL: http://data-service:8000
      VK_ADAPTER_MODE: ${VK_ADAPTER_MODE:-fake}
      VK_HEADLESS: ${VK_HEADLESS:-true}
      MIN_DELAY_SEC: ${MIN_DELAY_SEC:-1.0}
      MAX_DELAY_SEC: ${MAX_DELAY_SEC:-3.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      - data-service
    ports:
      - "8002:8000"
    networks:
      - backend

  messaging-service:
    build: ./messaging-service
    environment:
      DATA_SERVICE_URL: http://data-service:8000
      VK_ADAPTER_MODE: ${VK_ADAPTER_MODE:-fake}
      VK_HEADLESS: ${VK_HEADLESS:-true}
      MIN_DELAY_SEC: ${MIN_DELAY_SEC:-1.0}
      MAX_DELAY_SEC: ${MAX_DELAY_SEC:-3.0}
      INBOX_CHECK_CONCURRENCY: ${INBOX_CHECK_CONCURRENCY:-3}
      INBOX_CHECK_FILTER_BY_UNREAD_LIST: ${INBOX_CHECK_FILTER_BY_UNREAD_LIST:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      - data-service
    ports:
      - "8003:8000"
    networks:
      - backend

  orchestrator-service:
    build: ./orchestrator-service
    environment:
      DATA_SERVICE_URL: http://data-service:8000
      PARSER_SERVICE_URL: http://parser-service:8000
      MESSAGING_SERVICE_URL: http://messaging-service:8000
      POLL_INTERVAL_SEC: ${POLL_INTERVAL_SEC:-5}
      POLL_TIMEOUT_SEC: ${POLL_TIMEOUT_SEC:-1800}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      - data-service
      - parser-service
      - messaging-service
    ports:
      - "8004:8000"
    networks:
      - backend

networks:
  backend:

volumes:
  db_data:
